name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Start isolated test Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          redis-server --bind 127.0.0.1 --port 16379 --save "" --appendonly no --daemonize yes
          redis-cli -p 16379 ping

      - name: Run tests
        env:
          POLL_TEST_REDIS_URL: redis://127.0.0.1:16379
          SCHEDULER_TEST_REDIS_SERVER: /usr/bin/redis-server
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
